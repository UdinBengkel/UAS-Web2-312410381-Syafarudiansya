<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <div id="app">
    <!-- Navbar (hanya muncul kalau sudah login) -->
    <nav v-if="isLoggedIn" class="bg-indigo-700 text-white px-6 py-3 flex justify-between items-center">
      <span class="font-bold text-lg">📚 E-Library Admin</span>
      <div class="flex gap-4 items-center">
        <router-link to="/dashboard" class="hover:underline">Dashboard</router-link>
        <router-link to="/books"     class="hover:underline">Buku</router-link>
        <router-link to="/genres"    class="hover:underline">Genre</router-link>
        <router-link to="/members"   class="hover:underline">Anggota</router-link>
        <router-link to="/borrowings" class="hover:underline">Peminjaman</router-link>
        <button @click="logout" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm">Logout</button>
      </div>
    </nav>

    <router-view></router-view>
  </div>

  <!-- Load semua komponen -->
  <script src="components/Home.js"></script>
  <script src="components/Login.js"></script>
  <script src="components/Dashboard.js"></script>
  <script src="components/Books.js"></script>
  <script src="components/Genres.js"></script>
  <script src="components/Members.js"></script>
  <script src="components/Borrowings.js"></script>

  <script>
    const { createApp, ref } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // Axios base URL
    axios.defaults.baseURL = 'http://localhost:8080';

    // Axios Request Interceptor — auto inject token
    axios.interceptors.request.use(config => {
      const token = localStorage.getItem('token');
      if (token) config.headers.Authorization = `Bearer ${token}`;
      return config;
    });

    // Axios Response Interceptor — handle 401
    axios.interceptors.response.use(
      res => res,
      err => {
        if (err.response && err.response.status === 401) {
          alert('Sesi habis, silakan login kembali.');
          localStorage.removeItem('token');
          localStorage.removeItem('isLoggedIn');
          router.push('/login');
        }
        return Promise.reject(err);
      }
    );

    // Routes
    const routes = [
      { path: '/',           component: Home },
      { path: '/login',      component: Login },
      { path: '/dashboard',  component: Dashboard, meta: { requiresAuth: true } },
      { path: '/books',      component: Books,     meta: { requiresAuth: true } },
      { path: '/genres',     component: Genres,    meta: { requiresAuth: true } },
      { path: '/members',    component: Members,   meta: { requiresAuth: true } },
      { path: '/borrowings', component: Borrowings,meta: { requiresAuth: true } },
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // Navigation Guard
    router.beforeEach((to, from, next) => {
      const isLoggedIn = localStorage.getItem('isLoggedIn');
      if (to.meta.requiresAuth && !isLoggedIn) {
        next('/login');
      } else {
        next();
      }
    });

    // App
    const app = createApp({
      setup() {
        const isLoggedIn = ref(localStorage.getItem('isLoggedIn') === 'true');

        const logout = async () => {
          try {
            await axios.post('/auth/logout');
          } catch(e) {}
          localStorage.removeItem('token');
          localStorage.removeItem('isLoggedIn');
          isLoggedIn.value = false;
          router.push('/login');
        };

        // Update isLoggedIn saat route berubah
        router.afterEach(() => {
          isLoggedIn.value = localStorage.getItem('isLoggedIn') === 'true';
        });

        return { isLoggedIn, logout };
      }
    });

    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
